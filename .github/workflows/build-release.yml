name: Build and Release

# Replaces the stock dotnet-desktop template, which referenced
# your-solution-name / your-wap-project-path placeholders, ran a test step
# with no test projects, and could never have built this repo.
#
# How releases work:
#   - Push a version tag (e.g. v1.1.0) -> builds the x64 package, signs it
#     with the repo's self-signed cert secret, and publishes a GitHub Release
#     with the .msix + the signing certificate (.cer) attached.
#   - Manual run (workflow_dispatch) -> builds and uploads the package as a
#     workflow artifact only, no release.
#
# Required repo secrets:
#   SIGNING_CERT_PFX_BASE64  - base64 of the .pfx whose subject matches the
#                              manifest Publisher (CN=VetTV Studios).
#                              Create it with scripts\New-SigningCert.ps1.
#   SIGNING_CERT_PASSWORD    - the .pfx password.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET (for StreamerHost)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: msbuild XboxGameBarDirectStreamWidget.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Publish self-contained StreamerHost
        run: dotnet publish StreamerHost\StreamerHost.csproj -c Release -r win-x64 --self-contained true

      - name: Require signing secrets
        shell: powershell
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PFX_BASE64)) {
            throw "SIGNING_CERT_PFX_BASE64 is required to build an installable package."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            throw "SIGNING_CERT_PASSWORD is required to build an installable package."
          }

      - name: Decode signing certificate
        shell: powershell
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", $bytes)

      - name: Build signed package
        shell: powershell
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          msbuild DirectStreamWidget\DirectStreamWidget.csproj `
            /p:Configuration=Release /p:Platform=x64 `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\" `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\signing.pfx" `
            /p:PackageCertificatePassword="$env:SIGNING_CERT_PASSWORD"

      - name: Export public signing certificate
        shell: powershell
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $password = ConvertTo-SecureString $env:SIGNING_CERT_PASSWORD -AsPlainText -Force
          $certificate = (Get-PfxData -FilePath "$env:RUNNER_TEMP\signing.pfx" -Password $password).EndEntityCertificates[0]
          Export-Certificate -Cert $certificate -FilePath "$env:GITHUB_WORKSPACE\artifacts\VetTVStudios-Signing.cer" | Out-Null

      - name: Verify package signature
        shell: powershell
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $password = ConvertTo-SecureString $env:SIGNING_CERT_PASSWORD -AsPlainText -Force
          $certificate = (Get-PfxData -FilePath "$env:RUNNER_TEMP\signing.pfx" -Password $password).EndEntityCertificates[0]
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("TrustedPeople", "CurrentUser")
          $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          try {
            $store.Add($certificate)
          }
          finally {
            $store.Close()
          }

          $packages = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE\artifacts" -Filter *.msix -Recurse)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one MSIX package; found $($packages.Count)."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $packages[0].FullName
          if ($signature.Status -ne "Valid") {
            throw "MSIX signature is not valid: $($signature.StatusMessage)"
          }
          if ($signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
            throw "MSIX signer does not match the configured VetTV Studios certificate."
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectStreamWidget-x64
          path: artifacts/**/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## VetTV Direct Stream Widget ${{ github.ref_name }}

            Xbox Game Bar widget for direct RTMP streaming and platform-specific pinned chat overlays (Win+G) - Twitch, YouTube, Facebook, Kick, Rumble, and VetTV ingest.

            ### Install (Windows 10 20H1+ / Windows 11, x64)
            1. Download the `.msix` below.
            2. The package is signed with the VetTV Studios self-signed certificate. Before installing, trust it once: right-click the `.msix` > Properties > Digital Signatures > View Certificate > Install Certificate > Local Machine > Trusted People. (Or run `scripts\Install-Cert.ps1` once the matching `.cer` is attached to a release.)
            3. Double-click the `.msix` and install.
            4. Press **Win+G**, open the widget menu, and pin **Direct Stream**.
            5. Pin **Direct Stream Chat** as a separate Game Bar widget to keep platform chat visible while gaming.
            6. You need ffmpeg: put `ffmpeg.exe` next to the app (see INSTALL.md in the repo) or install ffmpeg and add it to PATH. For NVENC, use a current NVIDIA driver.

            Full instructions: INSTALL.md in the repo.
